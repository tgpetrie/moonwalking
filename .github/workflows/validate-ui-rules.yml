name: Validate UI rules

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.continue/**'
      - 'scripts/validate_ui_rules.sh'
      - '.github/workflows/validate-ui-rules.yml'

jobs:
  ui-rules:
    name: UI Rules Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run UI rules validator
        run: bash ./scripts/validate_ui_rules.sh
        shell: bash
