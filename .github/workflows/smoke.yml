name: Production Smoke Tests

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Railway origin and Cloudflare domains
        # A push may precede Railway's deploy. Rerun after deployment succeeds
        # and confirm its commit; this check establishes current availability.
        run: python scripts/production_smoke.py
