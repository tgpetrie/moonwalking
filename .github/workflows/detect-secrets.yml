name: detect-secrets

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  detect-secrets:
    name: Run pre-commit (detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the base branch is available to diff against.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Run pre-commit on the files this PR changes
        # Only the PR's own files. Running every hook over the whole repo
        # reformatted ~126 untouched Python files with black, which moved
        # existing `pragma: allowlist secret` comments off their lines and
        # made detect-secrets fail on code nobody had changed.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pre-commit run --from-ref "origin/${BASE_REF}" --to-ref HEAD --show-diff-on-failure
