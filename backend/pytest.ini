[pytest]
# Pytest configuration for sentiment aggregator tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto

# Coverage is intentionally not part of default addopts. Some Windows local
# venvs do not have pytest-cov installed, and a missing optional reporting
# plugin should not block normal backend test runs. When coverage is needed,
# run pytest with explicit --cov flags from an environment that has pytest-cov.

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for multi-component workflows
    slow: Tests that take more than a few seconds
    external_api: Tests that require external API calls (skip in CI)
    redis: Tests that require Redis connection

# Coverage options
[coverage:run]
omit =
    tests/*
    */__init__.py
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
