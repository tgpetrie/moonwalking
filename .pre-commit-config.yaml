repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/psf/black
  rev: 24.8.0
  hooks:
  - id: black
- repo: https://github.com/pre-commit/mirrors-eslint
  rev: v9.11.1
  hooks:
  - id: eslint
    # Pinned so runs are repeatable. The flat config lives in eslint.config.mjs;
    # without it ESLint 9+ failed on every run.
    additional_dependencies: ["eslint@10.15.0"]
    # identify tags .jsx as "jsx", not "javascript", so match by extension.
    types: [file]
    files: ^frontend/.*\.(js|jsx|mjs|cjs)$
    args: ["--no-warn-ignored"]
- repo: https://github.com/Yelp/detect-secrets
  # pin to a released tag or a commit SHA to avoid tag drift
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args: ["--baseline", ".secrets.baseline"]
    exclude: |
      (?x)^(
        frontend/(pnpm-lock\.yaml|package-lock\.json)$
        | pnpm-lock\.yaml$
        | package-lock\.json$
        | docs/research/.*
        | docs/ai/.*\.json$
      )
